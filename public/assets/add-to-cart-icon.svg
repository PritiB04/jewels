<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Soft Rose Gold Gradient for Bag Body -->
    <linearGradient id="bag-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DCA39B" />
      <stop offset="100%" stop-color="#C98C84" />
    </linearGradient>

    <!-- Spotlight Background Glow -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C98C84" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#C98C84" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#C98C84" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Glow Filter for Plus Sign -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style><![CDATA[
/* Pendulum Swing Animation */
      .swing {
        transform-origin: 50px 14px;
        animation: swing 3.2s ease-in-out infinite;
      }
      
      /* Subtle Pulse for Plus Sign */
      .pulse {
        transform-origin: 50px 65px;
        animation: pulse 2s ease-in-out infinite;
      }
      
      /* Dynamic Shadow matching Pendulum Physics */
      .shadow {
        transform-origin: 50px 94px;
        animation: shadow 3.2s ease-in-out infinite;
      }

      /* Twinkling Sparkles */
      .sparkle {
        transform-origin: 78px 35px;
        animation: twinkle 4s ease-in-out infinite;
      }
      .sparkle-small {
        transform-origin: 22px 28px;
        animation: twinkle 3s ease-in-out infinite 1.5s;
      }

      @keyframes swing {
        0% { transform: rotate(-7deg); }
        50% { transform: rotate(7deg); }
        100% { transform: rotate(-7deg); }
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.18); }
      }

      @keyframes shadow {
        0% { transform: translateX(7px) scaleX(0.85); opacity: 0.1; }
        25% { transform: translateX(0px) scaleX(1.05); opacity: 0.25; }
        50% { transform: translateX(-7px) scaleX(0.85); opacity: 0.1; }
        75% { transform: translateX(0px) scaleX(1.05); opacity: 0.25; }
        100% { transform: translateX(7px) scaleX(0.85); opacity: 0.1; }
      }

      @keyframes twinkle {
        0%, 100% { transform: scale(0.6) rotate(0deg); opacity: 0.3; }
        50% { transform: scale(1.1) rotate(15deg); opacity: 0.9; }
      }
]]></style>
  </defs>

  <!-- Atmospheric Background -->
  <circle cx="50" cy="55" r="42" fill="url(#bg-glow)" />

  <!-- Animated Floor Shadow -->
  <ellipse class="shadow" cx="50" cy="94" rx="16" ry="3" fill="#6D4C41" />

  <!-- Decorative Sparkles -->
  <path class="sparkle" d="M 78 30 Q 78 35 83 35 Q 78 35 78 40 Q 78 35 73 35 Q 78 35 78 30" fill="#C98C84" />
  <path class="sparkle-small" d="M 22 25 Q 22 28 25 28 Q 22 28 22 31 Q 22 28 19 28 Q 22 28 22 25" fill="#C98C84" />

  <!-- Main Swinging Shopping Bag -->
  <g class="swing">
    
    <!-- Bag Handle (Back/Inside) -->
    <path d="M 36 46 V 28 A 14 14 0 0 1 64 28 V 46" fill="none" stroke="#6D4C41" stroke-width="4" stroke-linecap="round" />

    <!-- Bag Body -->
    <rect x="22" y="38" width="56" height="50" rx="7" fill="url(#bag-fill)" stroke="#6D4C41" stroke-width="4" stroke-linejoin="round" />

    <!-- 2.5D Highlights for Volume -->
    <path d="M 28 42 L 72 42" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.45" />
    <path d="M 26 46 L 26 82" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.3" />

    <!-- Handle Rivets / Attachments -->
    <circle cx="36" cy="46" r="3.5" fill="#DCA39B" stroke="#6D4C41" stroke-width="3" />
    <circle cx="64" cy="46" r="3.5" fill="#DCA39B" stroke="#6D4C41" stroke-width="3" />

    <!-- Pulsing Plus Sign -->
    <g class="pulse">
      <!-- Soft Glow behind Plus -->
      <circle cx="50" cy="65" r="12" fill="#ffffff" opacity="0.5" filter="url(#glow)" />
      
      <!-- Plus Icon -->
      <path d="M 41 65 H 59 M 50 56 V 74" fill="none" stroke="#6D4C41" stroke-width="4" stroke-linecap="round" />
    </g>
    
  </g>
</svg>